<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>squirrelator</title>
<style>
  :root { --bg:#0f0f12; --card:#1a1a20; --accent:#26a69a; --text:#eee; --muted:#999; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
  header { background: linear-gradient(135deg,#1a1a2e,#0d3b36); padding: 1.2rem; text-align: center; border-bottom: 3px solid var(--accent); }
  header h1 { margin: 0; }
  header p { margin: 0.3rem 0 0; color: var(--muted); }
  main { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin-bottom: 1rem; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.2rem; }
  select, textarea, button { font: inherit; }
  select { width: 100%; padding: 0.5rem; background: var(--card); color: var(--text); border: 1px solid #333; border-radius: 6px; }
  textarea { width: 100%; flex: 1; min-height: 220px; padding: 0.7rem; background: var(--card); color: var(--text); border: 1px solid #333; border-radius: 6px; resize: vertical; }
  button { background: var(--accent); color: #000; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  button.secondary { background: #333; color: var(--text); }
  #out { background: var(--card); padding: 0.7rem; border-radius: 6px; white-space: pre-wrap; flex: 1; min-height: 220px; border: 1px solid #333; margin: 0; overflow: auto; }
  .translate-workspace { display: flex; gap: 0.75rem; align-items: stretch; min-height: 280px; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--card); border: 1px solid #333; border-radius: 8px; padding: 0.75rem; }
  .pane h2 { margin: 0 0 0.5rem; font-size: 1rem; color: var(--muted); font-weight: 600; }
  .picker { margin-bottom: 0.6rem; }
  .swap-col { display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  #swap-btn { padding: 0.55rem 0.75rem; font-size: 1.1rem; line-height: 1.2; min-width: 3.5rem; }
  .examples { margin-top: 1rem; }
  .examples button { background: #333; color: var(--text); margin: 0.2rem; font-size: 0.85rem; }
  @media (max-width: 820px) {
    .translate-workspace { flex-direction: column; }
    .swap-col { padding: 0.25rem 0; }
    textarea, #out { min-height: 160px; }
  }
</style>
</head>
<body>
<header>
  <h1>squirrelator</h1>
  <p>Translate between human language, pseudocode, and programming languages</p>
</header>
<main>
  <div class="toolbar">
    <button type="button" onclick="translate()">Translate</button>
    <button type="button" class="secondary" onclick="clearAll()">Clear</button>
    <span id="status" style="color: var(--muted); font-size: 0.9rem;"></span>
  </div>

  <div class="translate-workspace">
    <section class="pane" aria-labelledby="source-heading">
      <h2 id="source-heading">Source</h2>
      <div class="picker">
        <label for="from">From</label>
        <select id="from">
          <option value="english">English</option>
          <option value="pseudocode">Pseudocode</option>
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="quickbasic">QuickBASIC</option>
          <option value="brainfood">brainFOOD</option>
          <option value="lolcode">LOLCODE</option>
          <option value="z80">Z80 Assembly</option>
          <option value="shell">Shell</option>
          <option value="sql">SQL</option>
        </select>
      </div>
      <textarea id="source" aria-label="Source text">print hello</textarea>
    </section>

    <div class="swap-col">
      <button type="button" id="swap-btn" title="Swap languages" onclick="swapSides()">⇄</button>
    </div>

    <section class="pane" aria-labelledby="result-heading">
      <h2 id="result-heading">Result</h2>
      <div class="picker">
        <label for="to">To</label>
        <select id="to">
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="quickbasic">QuickBASIC</option>
          <option value="lolcode">LOLCODE</option>
          <option value="english">English</option>
          <option value="pseudocode">Pseudocode</option>
          <option value="brainfood">brainFOOD</option>
          <option value="z80">Z80 Assembly</option>
          <option value="shell">Shell</option>
          <option value="sql">SQL</option>
        </select>
      </div>
      <pre id="out">Click Translate or try an example below.</pre>
    </section>
  </div>

  <div class="examples">
    <label>Examples</label><br>
    <button type="button" onclick="load('print hello','english','python')">English → Python</button>
    <button type="button" onclick="load('for each number from 1 to 5 print it','english','quickbasic')">English → QuickBASIC</button>
    <button type="button" onclick="load('PRINT \"Hello\"','quickbasic','english')">QuickBASIC → English</button>
    <button type="button" onclick="load('VISIBLE \"Hi\"','lolcode','python')">LOLCODE → Python</button>
    <button type="button" onclick="load('set count to 10','english','javascript')">Assignment → JS</button>
  </div>
</main>

<script src="translate-ui.js"></script>
<script>
// Client-side rule engine (mirrors the Python package for standalone use)
const SUPPORTED = ["english","pseudocode","python","javascript","quickbasic","brainfood","lolcode","z80","sql","shell"];

function setStatus(msg) {
  document.getElementById("status").textContent = msg || "";
}

function translate() {
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;
  const src = document.getElementById("source").value.trim();
  if (!src) {
    setStatus("Enter some source text");
    return;
  }
  const out = doTranslate(src, from, to);
  document.getElementById("out").textContent = out;
  setStatus(`Translated ${languageLabel(from)} → ${languageLabel(to)}`);
}

function swapSides() {
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;
  const source = document.getElementById("source").value;
  const result = document.getElementById("out").textContent;
  const [newFrom, newTo, newSource, newResult] = swapTranslateState(from, to, source, result);
  document.getElementById("from").value = newFrom;
  document.getElementById("to").value = newTo;
  document.getElementById("source").value = newSource;
  document.getElementById("out").textContent = newResult || "Click Translate to update the result.";
  setStatus(`Swapped — ${languageLabel(newFrom)} → ${languageLabel(newTo)}`);
}

function clearAll() {
  document.getElementById("source").value = "";
  document.getElementById("out").textContent = "";
  setStatus("Cleared");
}

function load(src, from, to) {
  document.getElementById("source").value = src;
  document.getElementById("from").value = from;
  document.getElementById("to").value = to;
  translate();
}

function doTranslate(text, from, to) {
  from = from.toLowerCase(); to = to.toLowerCase();
  if (!SUPPORTED.includes(from) || !SUPPORTED.includes(to))
    return `Unsupported: ${from} → ${to}`;
  if (from === to) return text;

  if (from === "english" || from === "pseudocode")
    return fromNatural(text, to);
  if (to === "english")
    return toEnglish(text, from);
  return codeToCode(text, from, to);
}

function fromNatural(text, to) {
  const t = text.toLowerCase();
  let m = t.match(/(?:print|show|display|output)\s+['"]?(.+?)['"]?$/);
  if (m || t.includes("hello")) {
    const msg = m ? m[1].replace(/[\"']/g,"") : "Hello";
    const map = {
      python: `print("${msg}")`,
      javascript: `console.log("${msg}");`,
      quickbasic: `PRINT "${msg}"`,
      lolcode: `VISIBLE "${msg}"`,
      brainfood: `++++++++++[>+++++++>++++++++++>+++>+<<<<-]>++.>+.+++++++..+++.`,
      z80: `    ; print "${msg}"\n    LD   HL, msg\n    CALL print_string\nmsg: DEFM "${msg}"\n     DEFB 0`,
      shell: `echo "${msg}"`,
      sql: `SELECT '${msg}' AS message;`,
    };
    return map[to] || `# no mapping for ${to}`;
  }
  m = t.match(/(?:for|loop|count|repeat).*?(?:from\s+)?(\d+)\s+(?:to|through)\s+(\d+)/);
  if (m) {
    const [start, end] = [m[1], m[2]];
    const map = {
      python: `for i in range(${start}, ${+end+1}):\n    print(i)`,
      javascript: `for (let i = ${start}; i <= ${end}; i++) {\n  console.log(i);\n}`,
      quickbasic: `FOR i = ${start} TO ${end}\n  PRINT i\nNEXT i`,
      lolcode: `IM IN YR loop UPPIN YR i TIL BOTH SAEM i AN ${end}\n  VISIBLE i\nIM OUTTA YR loop`,
      shell: `for i in $(seq ${start} ${end}); do echo $i; done`,
    };
    return map[to] || `# no loop mapping for ${to}`;
  }
  m = t.match(/(?:set|let|make)\s+(\w+)\s+(?:to|=)\s+(.+)/);
  if (m) {
    const [v, val] = [m[1], m[2].trim()];
    const map = {
      python: `${v} = ${val}`,
      javascript: `let ${v} = ${val};`,
      quickbasic: `${v} = ${val}`,
      lolcode: `I HAS A ${v} ITZ ${val}`,
      shell: `${v}=${val}`,
    };
    return map[to] || `# no assignment mapping for ${to}`;
  }
  return `# No pattern matched\n# Source: ${text}`;
}

function withLiteral(sentence, literal) {
  return literal ? sentence + "\n" + literal : sentence;
}

function printed(inner) {
  const quoted = inner.length >= 2 && (inner[0] === '"' || inner[0] === "'") && inner[0] === inner.at(-1);
  const sentence = quoted ? "Print the word." : "Show the number.";
  return { display: withLiteral(sentence, inner), gloss: "Print " + inner };
}

function toEnglish(text, from) {
  return explainLines(text, from).map(e => e.display).join("\n") || "(no recognizable statements)";
}

function explainLines(text, from) {
  const lines = text.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#") && !l.startsWith(";"));
  const out = [];
  for (const s of lines) {
    if (from === "python" && s.startsWith("print(") && s.endsWith(")")) {
      const p = printed(s.slice(6, -1));
      out.push({ display: p.display, gloss: p.gloss });
    } else if (from === "python" && s.includes("for ") && s.includes(" in ")) {
      out.push({ display: "Start a loop.", gloss: "Start a loop" });
    } else if (from === "quickbasic" && s.toUpperCase().startsWith("PRINT")) {
      const p = printed(s.slice(5).trim());
      out.push({ display: p.display, gloss: p.gloss });
    } else if (from === "lolcode" && s.includes("VISIBLE")) {
      const rest = s.split("VISIBLE")[1].trim();
      out.push({ display: withLiteral("Print the word.", rest), gloss: "Show " + rest });
    } else if (from === "javascript" && s.includes("console.log")) {
      out.push({ display: withLiteral("Print the word on the screen.", s), gloss: "Print to console: " + s });
    } else if (from === "z80" && /LD/i.test(s)) {
      out.push({ display: withLiteral("Load the data.", s), gloss: "Load data: " + s });
    } else if (from === "z80" && /INC/i.test(s)) {
      out.push({ display: withLiteral("Add one.", s), gloss: "Increment: " + s });
    } else out.push({ display: "Execute: " + s, gloss: "Execute: " + s });
  }
  return out;
}

function codeToCode(text, from, to) {
  const gloss = explainLines(text, from).map(e => e.gloss).join("\n");
  if (!gloss || gloss.startsWith("(")) return `# Direct mapping not available\n# ${gloss}`;
  return fromNatural(gloss, to);
}

document.getElementById("source").addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    translate();
  }
});
</script>
</body>
</html>
