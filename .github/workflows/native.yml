name: Native apps

# Compile and test only: proves the Compose screens, the desktop build and the
# Android app still build on every PR and push to main. It uploads nothing
# and needs no secrets. A release APK is built with LanguageStudentDesk's
# shared debug key only to check the signer, then deleted. Releases are a
# separate, later step.
on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "squirrelator/**"
      - "data"
      - ".gitmodules"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"
      - "squirrelator/**"
      - "data"
      - ".gitmodules"
      - ".github/workflows/native.yml"

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The desktop tests run the real engine with this Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No wrapper jar is committed (the PR guard keeps .jar files out), so
      # Gradle comes from here, at the version the build was made with.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      # The runner image ships the Android SDK; just make sure API 36 is there.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" > /dev/null
      - name: Test the screens and the desktop engine link
        run: gradle --no-daemon :ui:desktopTest :desktop:test
      - name: Build the Android app (debug, not uploaded)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon :android:assembleDebug
      # The Play bundle builds too. Without the upload key (never on PRs) it's
      # debug-signed, which Play refuses, and it isn't uploaded anywhere.
      - name: Build the Play bundle (not signed for Play, not uploaded)
        run: gradle --no-daemon :android:bundleRelease
      # Same shared debug key as LanguageStudentDesk's release APKs. The APK
      # is deleted here: PR and push CI never upload one.
      - name: Check the release APK signer (not uploaded)
        env:
          UPLOAD_STORE_FILE: ${{ runner.temp }}/lsd-debug.keystore
          UPLOAD_STORE_PASSWORD: android
          UPLOAD_KEY_ALIAS: androiddebugkey
          UPLOAD_KEY_PASSWORD: android
        run: |
          curl -fsSL --retry 5 -o "$UPLOAD_STORE_FILE" \
            https://raw.githubusercontent.com/squirelworks/LanguageStudentDesk/main/SquirrelGo-Apps/lsd-suite/android/app/debug.keystore
          keytool -list -keystore "$UPLOAD_STORE_FILE" -storepass android -alias androiddebugkey > /dev/null
          # Also write the path into local.properties (the build already reads
          # upload.storeFile from there) so a Gradle configuration cache from
          # the earlier unsigned bundleRelease cannot ignore the env vars.
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "upload.storeFile=$UPLOAD_STORE_FILE"
            echo "upload.storePassword=$UPLOAD_STORE_PASSWORD"
            echo "upload.keyAlias=$UPLOAD_KEY_ALIAS"
            echo "upload.keyPassword=$UPLOAD_KEY_PASSWORD"
          } > local.properties
          gradle --no-daemon --no-configuration-cache :android:assembleRelease
          APKSIGNER=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=android/build/outputs/apk/release/android-release.apk
          ls -la android/build/outputs/apk/release/
          test -n "$APKSIGNER" && test -x "$APKSIGNER" && test -f "$APK"
          # Print certs to the log (do not trap stdout; a failed verify must be visible).
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apk-certs.txt"
          grep -E 'certificate (DN|SHA-256 digest):' "$RUNNER_TEMP/apk-certs.txt"
          # LanguageStudentDesk shared debug cert (squirrelgo-v0.1.5 APKs).
          grep -qiE 'SHA-256 digest: cdec9f5cd92ed1608c0c9457699a25ad2101bd1e52accd11197beaf672ddb369' "$RUNNER_TEMP/apk-certs.txt" \
            || { echo "release APK cert does not match LanguageStudentDesk's shared debug key"; exit 1; }
          rm -f "$APK" "$UPLOAD_STORE_FILE" "$RUNNER_TEMP/apk-certs.txt"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
