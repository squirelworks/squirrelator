[project]
name = "squirrelator"
version = "0.1.1"
description = "Core language translation engine for human, programming, and pseudo languages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["squirrelator*"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["data"]

[tool.ruff.lint]
# Errors and likely bugs only for now; style rules can be added one seam at a time.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
