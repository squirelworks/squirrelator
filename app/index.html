<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>squirrelator</title>
<style>
  :root { --bg:#0f0f12; --card:#1a1a20; --accent:#26a69a; --text:#eee; --muted:#999; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
  header { background: linear-gradient(135deg,#1a1a2e,#0d3b36); padding: 1.2rem; text-align: center; border-bottom: 3px solid var(--accent); }
  header h1 { margin: 0; }
  header p { margin: 0.3rem 0 0; color: var(--muted); }
  main { max-width: 800px; margin: 1.5rem auto; padding: 0 1rem; }
  .row { display: flex; gap: 0.8rem; margin-bottom: 0.8rem; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.2rem; }
  select, textarea, button { font: inherit; }
  select { flex: 1; padding: 0.5rem; background: var(--card); color: var(--text); border: 1px solid #333; border-radius: 6px; }
  textarea { width: 100%; min-height: 140px; padding: 0.7rem; background: var(--card); color: var(--text); border: 1px solid #333; border-radius: 6px; }
  button { background: var(--accent); color: #000; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  pre { background: var(--card); padding: 1rem; border-radius: 6px; white-space: pre-wrap; min-height: 120px; border: 1px solid #333; }
  .examples { margin-top: 1rem; }
  .examples button { background: #333; color: var(--text); margin: 0.2rem; font-size: 0.85rem; }
</style>
</head>
<body>
<header>
  <h1>squirrelator</h1>
  <p>Translate between human language, pseudocode, and programming languages</p>
</header>
<main>
  <div class="row">
    <div style="flex:1">
      <label>From</label>
      <select id="from">
        <option value="english">English</option>
        <option value="pseudocode">Pseudocode</option>
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="quickbasic">QuickBASIC</option>
        <option value="brainfood">brainFOOD</option>
        <option value="lolcode">LOLCODE</option>
        <option value="z80">Z80 Assembly</option>
        <option value="shell">Shell</option>
        <option value="sql">SQL</option>
      </select>
    </div>
    <div style="flex:1">
      <label>To</label>
      <select id="to">
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="quickbasic">QuickBASIC</option>
        <option value="lolcode">LOLCODE</option>
        <option value="english">English</option>
        <option value="pseudocode">Pseudocode</option>
        <option value="brainfood">brainFOOD</option>
        <option value="z80">Z80 Assembly</option>
        <option value="shell">Shell</option>
        <option value="sql">SQL</option>
      </select>
    </div>
  </div>

  <label>Source</label>
  <textarea id="source">print hello</textarea>

  <div style="margin: 0.8rem 0;">
    <button onclick="translate()">Translate</button>
  </div>

  <label>Result</label>
  <pre id="out">Click Translate or try an example below.</pre>

  <div class="examples">
    <label>Examples</label><br>
    <button onclick="load('print hello','english','python')">English → Python</button>
    <button onclick="load('for each number from 1 to 5 print it','english','quickbasic')">English → QuickBASIC</button>
    <button onclick="load('PRINT \"Hello\"','quickbasic','english')">QuickBASIC → English</button>
    <button onclick="load('VISIBLE \"Hi\"','lolcode','python')">LOLCODE → Python</button>
    <button onclick="load('set count to 10','english','javascript')">Assignment → JS</button>
  </div>
</main>

<script>
// Client-side rule engine (mirrors the Python package for standalone use)
const SUPPORTED = ["english","pseudocode","python","javascript","quickbasic","brainfood","lolcode","z80","sql","shell"];

function translate() {
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;
  const src = document.getElementById("source").value.trim();
  document.getElementById("out").textContent = doTranslate(src, from, to);
}

function load(src, from, to) {
  document.getElementById("source").value = src;
  document.getElementById("from").value = from;
  document.getElementById("to").value = to;
  translate();
}

function doTranslate(text, from, to) {
  from = from.toLowerCase(); to = to.toLowerCase();
  if (!SUPPORTED.includes(from) || !SUPPORTED.includes(to))
    return `Unsupported: ${from} → ${to}`;
  if (from === to) return text;

  if (from === "english" || from === "pseudocode")
    return fromNatural(text, to);
  if (to === "english")
    return toEnglish(text, from);
  return codeToCode(text, from, to);
}

function fromNatural(text, to) {
  const t = text.toLowerCase();
  let m = t.match(/(?:print|show|display|output)\s+['"]?(.+?)['"]?$/);
  if (m || t.includes("hello")) {
    const msg = m ? m[1].replace(/[\"']/g,"") : "Hello";
    const map = {
      python: `print("${msg}")`,
      javascript: `console.log("${msg}");`,
      quickbasic: `PRINT "${msg}"`,
      lolcode: `VISIBLE "${msg}"`,
      brainfood: `++++++++++[>+++++++>++++++++++>+++>+<<<<-]>++.>+.+++++++..+++.`,
      z80: `    ; print "${msg}"\n    LD   HL, msg\n    CALL print_string\nmsg: DEFM "${msg}"\n     DEFB 0`,
      shell: `echo "${msg}"`,
      sql: `SELECT '${msg}' AS message;`,
    };
    return map[to] || `# no mapping for ${to}`;
  }
  m = t.match(/(?:for|loop|count|repeat).*?(?:from\s+)?(\d+)\s+(?:to|through)\s+(\d+)/);
  if (m) {
    const [start, end] = [m[1], m[2]];
    const map = {
      python: `for i in range(${start}, ${+end+1}):\n    print(i)`,
      javascript: `for (let i = ${start}; i <= ${end}; i++) {\n  console.log(i);\n}`,
      quickbasic: `FOR i = ${start} TO ${end}\n  PRINT i\nNEXT i`,
      lolcode: `IM IN YR loop UPPIN YR i TIL BOTH SAEM i AN ${end}\n  VISIBLE i\nIM OUTTA YR loop`,
      shell: `for i in $(seq ${start} ${end}); do echo $i; done`,
    };
    return map[to] || `# no loop mapping for ${to}`;
  }
  m = t.match(/(?:set|let|make)\s+(\w+)\s+(?:to|=)\s+(.+)/);
  if (m) {
    const [v, val] = [m[1], m[2].trim()];
    const map = {
      python: `${v} = ${val}`,
      javascript: `let ${v} = ${val};`,
      quickbasic: `${v} = ${val}`,
      lolcode: `I HAS A ${v} ITZ ${val}`,
      shell: `${v}=${val}`,
    };
    return map[to] || `# no assignment mapping for ${to}`;
  }
  return `# No pattern matched\n# Source: ${text}`;
}

function toEnglish(text, from) {
  const lines = text.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#") && !l.startsWith(";"));
  const out = [];
  for (const s of lines) {
    if (from === "python" && s.startsWith("print(")) out.push("Print " + s.slice(6,-1));
    else if (from === "quickbasic" && s.toUpperCase().startsWith("PRINT")) out.push("Print " + s.slice(5).trim());
    else if (from === "lolcode" && s.includes("VISIBLE")) out.push("Show " + s.split("VISIBLE")[1].trim());
    else if (from === "javascript" && s.includes("console.log")) out.push("Print to console");
    else if (from === "z80" && /LD/i.test(s)) out.push("Load data: " + s);
    else if (from === "z80" && /INC/i.test(s)) out.push("Increment: " + s);
    else out.push("Execute: " + s);
  }
  return out.length ? out.join("\n") : "(no recognizable statements)";
}

function codeToCode(text, from, to) {
  const eng = toEnglish(text, from);
  if (eng.startsWith("(")) return `# Direct mapping not available\n# ${eng}`;
  return fromNatural(eng, to);
}
</script>
</body>
</html>
