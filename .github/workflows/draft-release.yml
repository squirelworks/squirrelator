name: Draft release

# Started by hand (see RELEASE_PLAN.md). Runs the tests, builds the wheel and
# source archive, and makes or refreshes a DRAFT GitHub Release. It never
# publishes, and never creates, moves or deletes a tag: publishing does that.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to draft, e.g. v0.1.0"
        required: true
      ref:
        description: "Branch or commit to release (default: main)"
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: draft-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the version and that it isn't released yet
        run: |
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "version must look like v1.2.3"; exit 1; }
          PY=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$PY" = "$VERSION" ] || { echo "pyproject.toml says $PY, not ${VERSION#v}"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION already exists; tags are never reused or moved"; exit 1
          fi
          if gh release view "$VERSION" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then
            echo "release $VERSION is already published"; exit 1
          fi

      - name: Tests
        run: |
          python -m pip install -q pytest build
          python -m pytest -q

      - name: Build wheel and source archive
        run: |
          python -m build --outdir dist
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Write the notes
        run: |
          SHA=$(git rev-parse HEAD)
          DATA=$(git ls-tree HEAD data 2>/dev/null | awk '{print $3}')
          {
            if [ -f "release-notes/$VERSION.md" ]; then
              cat "release-notes/$VERSION.md"
            else
              echo "Notes for $VERSION haven't been written yet."
            fi
            echo
            echo "---"
            echo
            echo "Built from \`$SHA\`, with squirrel-lang-data at \`${DATA:-not included}\`."
            echo
            PREV=$(git tag --list 'v*' --sort=-v:refname | head -1)
            if [ -n "$PREV" ]; then
              echo "### Changes since $PREV"
              git log --format='- %s' "$PREV..HEAD"
            fi
          } > notes.md
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Make or refresh the draft release
        run: |
          TITLE="squirrelator $VERSION"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --draft --target "$SHA" --title "$TITLE" --notes-file notes.md
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* --draft --target "$SHA" --title "$TITLE" --notes-file notes.md
          fi
          gh release view "$VERSION" --json url -q .url
