name: Google Play

# squirrelator's phone app on Google Play, the same way the SquirrelGo apps go
# (LanguageStudentDesk squirrelgo-play.yml). When the owner publishes a
# release, this builds the app's AAB from that tag, signs it with the upload
# key, and sends it to the internal testing track. Closed testing is a
# hand-started promotion of that same build, so nothing is built twice.
# The AAB never leaves the runner: no artifact, no release asset, no commit.
# Setup and secrets: native/README.md, "Google Play".
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag, e.g. v0.1.1"
        required: true
      action:
        description: "upload: build the tag and send it to internal testing. promote: move that build from internal testing to closed testing. check: only test the secrets."
        required: true
        default: upload
        type: choice
        options: [upload, promote, check]
      status:
        description: "auto rolls out to testers (a draft while the app has never been published); draft always waits in Play Console"
        required: false
        default: auto
        type: choice
        options: [auto, completed, draft]

permissions:
  contents: read

concurrency:
  group: play-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  PACKAGE: com.squirelworks.squirrelator
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # Play's track names. Repository variables override them if the owner's
  # closed testing track isn't the default "Closed testing - Alpha".
  INTERNAL_TRACK: ${{ vars.PLAY_INTERNAL_TRACK || 'internal' }}
  CLOSED_TRACK: ${{ vars.PLAY_TRACK || 'alpha' }}

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The upload key opens with its passwords
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PW: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::UPLOAD_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          trap 'rm -f "$RUNNER_TEMP/upload.keystore" "$RUNNER_TEMP/probe.jar"' EXIT
          keytool -list -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$STORE_PW" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::the store password or alias is wrong"; exit 1; }
          # Signing a throwaway file proves the key password too.
          echo probe > "$RUNNER_TEMP/probe.txt" && (cd "$RUNNER_TEMP" && jar cf probe.jar probe.txt)
          jarsigner -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$STORE_PW" -keypass "$KEY_PW" \
            "$RUNNER_TEMP/probe.jar" "$KEY_ALIAS" > /dev/null \
            || { echo "::error::the key password is wrong"; exit 1; }
          keytool -list -v -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$STORE_PW" -alias "$KEY_ALIAS" \
            | grep -E "Owner:|SHA256:" | head -2
          echo "upload key: OK"
      - name: Play can be reached
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python -m pip install -q google-api-python-client google-auth
          python .github/scripts/play_upload.py check "$PACKAGE"

  upload:
    # Only real releases, not pre-releases or drafts.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.action == 'upload') ||
      (github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: Secrets are set
        env:
          HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
          HAS_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
        working-directory: .
        run: |
          [ "$HAS_PLAY" = true ] || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is missing; see native/README.md"; exit 1; }
          # Play refuses debug-signed bundles, so don't build one for it.
          [ "$HAS_KEY" = true ] || { echo "::error::UPLOAD_KEYSTORE_BASE64 secret is missing; see native/README.md"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          submodules: recursive
      - name: The tag's version is the app's version
        run: |
          V=$(python3 -c "import tomllib;print(tomllib.load(open('../pyproject.toml','rb'))['project']['version'])")
          [ "v$V" = "$TAG" ] || { echo "::error::pyproject.toml at $TAG says $V"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy compiles the engine with the build machine's Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" > /dev/null
      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PW: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          {
            echo "UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.keystore"
            echo "UPLOAD_STORE_PASSWORD=$STORE_PW"
            echo "UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "UPLOAD_KEY_PASSWORD=$KEY_PW"
          } >> "$GITHUB_ENV"
      - name: Build the AAB
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon :android:bundleRelease
          AAB="$PWD/android/build/outputs/bundle/release/android-release.aab"
          keytool -printcert -jarfile "$AAB" | grep -q "CN=Android Debug" \
            && { echo "::error::the AAB is debug-signed; check the UPLOAD_* secrets"; exit 1; }
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          # Play shows this as the release name: the app's own name and version.
          LABEL=$(grep -o '<string name="app_name">[^<]*' android/src/main/res/values/strings.xml | sed 's/.*>//')
          echo "RELEASE_NAME=${LABEL:-squirrelator} $VERSION" >> "$GITHUB_ENV"
      - name: Release notes
        working-directory: .
        run: |
          if [ -f "release-notes/$TAG.md" ]; then
            # Plain text for Play: drop headings, links and tables.
            sed -E -e '/^\|/d' -e 's/^#+ *//' -e 's/\[([^]]*)\]\([^)]*\)/\1/g' -e 's/[*`]//g' "release-notes/$TAG.md" \
              | grep -v '^\s*$' | head -c 500 > "$RUNNER_TEMP/notes.txt"
          else
            echo "squirrelator $TAG" > "$RUNNER_TEMP/notes.txt"
          fi
      - name: Send to internal testing
        working-directory: .
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python -m pip install -q google-api-python-client google-auth
          python .github/scripts/play_upload.py upload --package "$PACKAGE" --aab "$AAB" \
            --track "$INTERNAL_TRACK" --status "${{ inputs.status || 'auto' }}" \
            --name "$RELEASE_NAME" --notes-file "$RUNNER_TEMP/notes.txt"
      - name: Remove the key and the AAB
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/upload.keystore" "$AAB"

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote internal testing to closed testing
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # The versionCode the build.gradle.kts gives this version (0.1.1 -> 101).
          CODE=$(python3 -c "import tomllib;a,b,c=map(int,tomllib.load(open('pyproject.toml','rb'))['project']['version'].split('.'));print(a*10000+b*100+c)")
          python -m pip install -q google-api-python-client google-auth
          python .github/scripts/play_upload.py promote --package "$PACKAGE" \
            --from-track "$INTERNAL_TRACK" --track "$CLOSED_TRACK" --version-code "$CODE" \
            --status "${{ inputs.status || 'auto' }}"
