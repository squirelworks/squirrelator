name: CI

# Checks only. Nothing is built for download or uploaded here; releases go
# through the hand-started Draft release workflow (see RELEASE_PLAN.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -q -e ".[dev]"
      - run: python -m pytest -q

  data-pin:
    # data/ may only point at a commit on squirrel-lang-data's main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the data/ submodule is pinned to a commit on main
        run: |
          PIN=$(git ls-tree HEAD data | awk '$2 == "commit" {print $3}')
          [ -n "$PIN" ] || { echo "no data/ submodule"; exit 1; }
          URL=$(git config -f .gitmodules submodule.data.url)
          git init -q "$RUNNER_TEMP/data" && cd "$RUNNER_TEMP/data"
          git fetch -q --filter=blob:none "$URL" main
          if git merge-base --is-ancestor "$PIN" FETCH_HEAD 2>/dev/null; then
            echo "data/ is pinned to $PIN, on squirrel-lang-data main."
            TAG=$(git ls-remote --tags "$URL" | awk -v p="$PIN" '$1 == p {sub("refs/tags/", "", $2); print $2}')
            echo "Tag at that commit: ${TAG:-none}"
          else
            echo "data/ is pinned to $PIN, which isn't on squirrel-lang-data main."
            echo "Pin it to a commit on main, preferably a release tag (see RELEASE_PLAN.md)."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q "ruff==0.16.9"
      - run: ruff check --output-format=github .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 .github/scripts/check_web.py app
