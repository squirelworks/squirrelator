[project]
name = "squirrelator"
version = "0.1.0"
description = "Core language translation engine for human, programming, and pseudo languages"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["squirrelator*"]
