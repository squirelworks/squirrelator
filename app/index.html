<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>squirrelator</title>
<style>
  :root { --bg:#0f0f12; --card:#1a1a20; --accent:#26a69a; --text:#eee; --muted:#999; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
  header { background: linear-gradient(135deg,#1a1a2e,#0d3b36); padding: 1.2rem; text-align: center; border-bottom: 3px solid var(--accent); position: relative; }
  #open-settings { position: absolute; right: 1rem; top: 1rem; background: #333; color: var(--text); border: 1px solid #444; padding: 0.4rem 0.8rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
  header h1 { margin: 0; }
  header p { margin: 0.3rem 0 0; color: var(--muted); }
  main { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin-bottom: 1rem; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.2rem; }
  select, textarea, button { font: inherit; }
  select { width: 100%; padding: 0.5rem; background: var(--card); color: var(--text); border: 1px solid #333; border-radius: 6px; }
  select optgroup { color: var(--muted); font-weight: 600; font-style: normal; }
  textarea { width: 100%; flex: 1; min-height: 220px; padding: 0.7rem; background: var(--card); color: var(--text); border: 1px solid #333; border-radius: 6px; resize: vertical; }
  button { background: var(--accent); color: #000; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  button.secondary { background: #333; color: var(--text); }
  #out { background: var(--bg); padding: 0.7rem; border-radius: 6px; white-space: pre-wrap; flex: 1; min-height: 120px; border: 1px solid #333; margin: 0; overflow: auto; font-family: ui-monospace, monospace; }
  #result-footer { color: var(--muted); font-size: 0.9rem; white-space: pre-wrap; margin: 0.45rem 0 0; padding: 0.5rem 0.7rem; border-radius: 6px; border: 1px dashed #333; }
  .unknown-token { background: rgba(255, 193, 7, 0.35); border-radius: 3px; }
  .alpha-badge { font-size: 0.75rem; font-weight: 700; background: #5c4d00; color: #ffc107; padding: 0.15rem 0.5rem; border-radius: 4px; margin-left: auto; align-self: center; }
  .pane-title { display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.5rem; }
  .pane-title h2 { margin: 0; flex: 0 0 auto; }
  #source { flex: 1; min-height: 220px; padding: 0.7rem; background: var(--card); color: var(--text); border: 1px solid #333; border-radius: 6px; overflow: auto; white-space: pre-wrap; font-family: ui-monospace, monospace; outline: none; }
  #source:empty::before { content: "Enter source text"; color: var(--muted); }
  #source.source-highlighted { background: var(--bg); }
  .alt-block { margin-top: 0.65rem; padding-top: 0.55rem; border-top: 1px solid #333; }
  .alt-heading { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
  .alt-list { list-style: none; margin: 0; padding: 0; }
  .alt-list li { padding: 0.35rem 0.5rem; margin: 0.2rem 0; background: var(--bg); border-radius: 4px; font-family: ui-monospace, monospace; font-size: 0.95rem; }
  .bd-block { margin-top: 0.65rem; padding-top: 0.55rem; border-top: 1px solid #333; }
  .bd-heading { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
  .bd-body { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .bd-list { list-style: none; margin: 0; padding: 0; flex: 1 1 140px; min-width: 120px; max-height: 160px; overflow: auto; }
  .bd-list li { padding: 0.35rem 0.5rem; margin: 0.15rem 0; background: var(--bg); border-radius: 4px; font-family: ui-monospace, monospace; font-size: 0.9rem; cursor: pointer; border: 1px solid transparent; }
  .bd-list li.bd-selected, .bd-list li:focus { border-color: var(--accent); outline: none; }
  .bd-detail { flex: 1 1 200px; font-size: 0.9rem; }
  .bd-field { margin-bottom: 0.45rem; }
  .bd-label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.15rem; }
  .bd-value { white-space: pre-wrap; font-family: ui-monospace, monospace; }
  .translate-workspace { display: flex; gap: 0.75rem; align-items: stretch; min-height: 280px; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--card); border: 1px solid #333; border-radius: 8px; padding: 0.75rem; }
  .pane h2 { margin: 0 0 0.5rem; font-size: 1rem; color: var(--muted); font-weight: 600; }
  .picker { margin-bottom: 0.6rem; }
  .swap-col { display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  #swap-btn { padding: 0.55rem 0.75rem; font-size: 1.1rem; line-height: 1.2; min-width: 3.5rem; }
  .examples { margin-top: 1rem; }
  .examples button { background: #333; color: var(--text); margin: 0.2rem; font-size: 0.85rem; }
  @media (max-width: 820px) {
    .translate-workspace { flex-direction: column; }
    .swap-col { padding: 0.25rem 0; }
    textarea, #out { min-height: 160px; }
  }
  [hidden] { display: none !important; }
  .sqf-notice { display: flex; align-items: center; gap: .5rem; margin: .75rem 0; padding: .6rem .8rem;
    background: #121a1a; border: 1px solid #1e4a44; border-radius: 10px; color: #e8e8e8; font-size: .9rem; line-height: 1.4; }
  .sqf-notice span { flex: 1 1 auto; min-width: 0; }
  .sqf-link { background: none; border: 0; padding: .3rem 0; color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer; min-height: 32px; }
  .sqf-close { background: none; border: 1px solid #3a3a44; border-radius: 8px; color: #aaa; font-size: 1.1rem; width: 36px; height: 36px; cursor: pointer; }
  .sqf-levels, .sqf-switches { margin: 0 0 1rem; padding: .6rem .85rem; border: 1px solid #2a2a32; border-radius: 12px; background: #16161c; }
  .sqf-levels legend, .sqf-switches legend { padding: 0 .3rem; color: #aaa; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
  .sqf-row { display: flex; gap: .6rem; align-items: flex-start; margin: .45rem 0; cursor: pointer; color: var(--text); }
  .sqf-row input { margin-top: .25rem; width: 1.1rem; height: 1.1rem; accent-color: var(--accent); flex: 0 0 auto; }
  .sqf-row strong, .sqf-whats strong { display: block; color: #e8e8e8; }
  .sqf-row small, .sqf-whats small { display: block; color: #aaa; font-size: .85rem; line-height: 1.35; }
  .sqf-custom { margin: .3rem 0 0; color: var(--accent); font-size: .85rem; }
  .sqf-whats h2 { margin: 0 0 .35rem; color: var(--accent); font-size: 1.15rem; }
  .sqf-whats ul { list-style: none; margin: 0; padding: 0; }
  .sqf-whats li { margin: .5rem 0; padding: .6rem .8rem; background: #1a1a20; border-radius: 10px; }
  .sqf-whats strong { display: inline; }
  .sqf-off { color: #aaa; font-size: .85rem; }
  .sqf-on { color: #8bc34a; font-size: .85rem; }
</style>
</head>
<body>
<header>
  <button type="button" id="open-settings">Settings</button>
  <h1>squirrelator</h1>
  <p>Translate between human language, pseudocode, and programming languages</p>
</header>
<main>
  <div id="notice" hidden></div>
  <section id="settings" hidden></section>

  <div class="toolbar">
    <button type="button" onclick="translate()">Translate</button>
    <button type="button" class="secondary" onclick="clearAll()">Clear</button>
    <span id="status" style="color: var(--muted); font-size: 0.9rem;"></span>
  </div>

  <div class="translate-workspace">
    <section class="pane" aria-labelledby="source-heading">
      <div class="pane-title">
        <h2 id="source-heading">Source</h2>
      </div>
      <div class="picker">
        <label for="from">From</label>
        <select id="from"></select>
      </div>
      <div id="source" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Source text">print hello</div>
    </section>

    <div class="swap-col">
      <button type="button" id="swap-btn" title="Swap languages" onclick="swapSides()">⇄</button>
    </div>

    <section class="pane" aria-labelledby="result-heading">
      <div class="pane-title">
        <h2 id="result-heading">Result</h2>
        <span id="alpha-badge" class="alpha-badge" hidden>Alpha</span>
      </div>
      <div class="picker">
        <label for="to">To</label>
        <select id="to"></select>
      </div>
      <div id="out">Click Translate or try an example below.</div>
      <div id="result-footer" hidden></div>
      <div id="alternatives" class="alt-block" hidden></div>
      <div id="breakdown" class="bd-block" hidden></div>
    </section>
  </div>

  <div class="examples">
    <label>Examples</label><br>
    <button type="button" onclick="load('print hello','english','python')">English → Python</button>
    <button type="button" onclick="load('for each number from 1 to 5 print it','english','quickbasic')">English → QuickBASIC</button>
    <button type="button" onclick="load('PRINT \"Hello\"','quickbasic','english')">QuickBASIC → English</button>
    <button type="button" onclick="load('VISIBLE \"Hi\"','lolcode','python')">LOLCODE → Python</button>
    <button type="button" onclick="load('set count to 10','english','javascript')">Assignment → JS</button>
  </div>
</main>

<script src="features.js"></script>
<script src="features-settings.js"></script>
<script src="translate-ui.js"></script>
<script src="prose.js"></script>
<script>
// Client-side rule engine (mirrors the Python package for standalone use)
const LANG_LABELS = {
  english: "English",
  pseudocode: "Pseudocode",
  python: "Python",
  javascript: "JavaScript",
  quickbasic: "QuickBASIC",
  brainfood: "brainFOOD",
  lolcode: "LOLCODE",
  z80: "Z80 Assembly",
  shell: "Shell",
  sql: "SQL",
};
const SUPPORTED = Object.keys(LANG_LABELS);

function visibleLangs() {
  return RULES_LANG_ORDER.filter(
    (id) => SUPPORTED.includes(id) && SquirrelFeatures.allowsLanguage(id),
  );
}

function appendPickerOptions(select, entries) {
  let group = null;
  for (const entry of entries) {
    if (entry.kind === "header") {
      group = document.createElement("optgroup");
      group.label = entry.value;
      select.appendChild(group);
      continue;
    }
    const opt = document.createElement("option");
    opt.value = entry.value;
    opt.textContent = LANG_LABELS[entry.value] || languageLabel(entry.value);
    (group || select).appendChild(opt);
  }
}

function fillSelects(keep) {
  const langs = visibleLangs();
  const entries = buildLanguagePickerEntries(langs);
  const langIds = langs;
  for (const id of ["from", "to"]) {
    const sel = document.getElementById(id);
    const prev = keep && sel.value;
    sel.innerHTML = "";
    appendPickerOptions(sel, entries);
    if (prev && langIds.includes(prev)) sel.value = prev;
    else if (id === "from" && langIds.includes("english")) sel.value = "english";
    else if (id === "to" && langIds.includes("python")) sel.value = "python";
    else if (langIds.length) sel.value = langIds[0];
  }
}

function setStatus(msg) {
  document.getElementById("status").textContent = msg || "";
}

function fullResultText(body, meta) {
  const parts = [body];
  if (meta.unknown && meta.unknown.length) {
    parts.push("Not in the data yet: " + meta.unknown.join(", "));
  }
  if (meta.alpha && meta.confidence != null) {
    parts.push(`Alpha. Confidence ${Math.round(meta.confidence * 100)}%.`);
  }
  return parts.join("\n\n");
}

function translate() {
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;
  const src = sourcePlainText(document.getElementById("source")).trim();
  if (!src) {
    setStatus("Enter some source text");
    return;
  }
  const { text, alternatives, breakdown, unknown, alpha, confidence } = doTranslate(src, from, to);
  const body = text;
  const full = fullResultText(body, { unknown, alpha, confidence });
  renderResultPane(
    document.getElementById("out"),
    document.getElementById("result-footer"),
    document.getElementById("alpha-badge"),
    { result: full, body, unknown, alpha },
  );
  renderSourceHighlight(document.getElementById("source"), src, from, unknown);
  renderAlternatives(document.getElementById("alternatives"), "Alternatives", alternatives);
  renderBreakdown(document.getElementById("breakdown"), "Breakdown", breakdown);
  setStatus(`Translated ${languageLabel(from)} → ${languageLabel(to)}`);
}

function swapSides() {
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;
  const source = sourcePlainText(document.getElementById("source"));
  const out = document.getElementById("out");
  const foot = document.getElementById("result-footer");
  const result = (out.textContent || "") + (foot.hidden ? "" : "\n\n" + foot.textContent);
  const [newFrom, newTo, newSource, newResult] = swapTranslateState(from, to, source, result);
  if (!visibleLangs().includes(newFrom) || !visibleLangs().includes(newTo)) {
    fillSelects(false);
  }
  document.getElementById("from").value = newFrom;
  document.getElementById("to").value = newTo;
  document.getElementById("source").textContent = newSource;
  document.getElementById("alpha-badge").hidden = true;
  foot.hidden = true;
  foot.textContent = "";
  out.textContent = newResult || "Click Translate to update the result.";
  renderAlternatives(document.getElementById("alternatives"), "Alternatives", []);
  renderBreakdown(document.getElementById("breakdown"), "Breakdown", []);
  setStatus(`Swapped — ${languageLabel(newFrom)} → ${languageLabel(newTo)}`);
}

function clearAll() {
  document.getElementById("source").textContent = "";
  document.getElementById("out").textContent = "";
  document.getElementById("result-footer").hidden = true;
  document.getElementById("result-footer").textContent = "";
  document.getElementById("alpha-badge").hidden = true;
  renderAlternatives(document.getElementById("alternatives"), "Alternatives", []);
  renderBreakdown(document.getElementById("breakdown"), "Breakdown", []);
  setStatus("Cleared");
}

function load(src, from, to) {
  document.getElementById("source").textContent = src;
  if (!SquirrelFeatures.allowsLanguage(from) || !SquirrelFeatures.allowsLanguage(to)) {
    document.getElementById("out").textContent = "Turn on the matching switch in Settings to use this example.";
    setStatus("Example needs a Settings switch");
    return;
  }
  document.getElementById("from").value = from;
  document.getElementById("to").value = to;
  translate();
}

function doTranslateOne(text, from, to) {
  if (!SUPPORTED.includes(from) || !SUPPORTED.includes(to))
    return { text: `Unsupported: ${from} → ${to}`, alternatives: [], breakdown: [], unknown: [], alpha: false, confidence: 0 };
  if (!SquirrelFeatures.allowsLanguage(from) || !SquirrelFeatures.allowsLanguage(to))
    return { text: "That language is off in Settings.", alternatives: [], breakdown: [], unknown: [], alpha: false, confidence: 0 };
  if (from === to) return { text, alternatives: [], breakdown: [], unknown: [], alpha: false, confidence: 1 };

  let textOut;
  if (from === "english" || from === "pseudocode")
    textOut = fromNatural(text, to);
  else if (to === "english")
    textOut = toEnglish(text, from);
  else
    textOut = codeToCode(text, from, to);
  let breakdown = [];
  if (to === "english" && from !== "english" && from !== "pseudocode") {
    breakdown = breakdownFromCode(text, from);
  } else if ((from === "english" || from === "pseudocode") && to !== "english") {
    breakdown = breakdownFromEnglish(text, textOut);
  }
  const unknown = [];
  if (textOut.includes("# No pattern matched") || textOut.startsWith("# Could not")) {
    unknown.push(text.trim());
  }
  const alpha = pairShowsAlpha(from, to);
  const confidence = unknown.length ? 0 : (textOut.startsWith("#") ? 0.5 : 1);
  return { text: textOut, alternatives: [], breakdown, unknown, alpha, confidence };
}

function doTranslate(text, from, to) {
  from = from.toLowerCase();
  to = to.toLowerCase();
  if (shouldTranslateProse(text, from, to)) {
    const parts = [];
    const translatedParagraphs = [];
    for (const paragraph of splitProseParagraphs(text)) {
      const sentenceTexts = [];
      for (const sentence of splitSentences(paragraph)) {
        const part = doTranslateOne(sentence, from, to);
        parts.push(part);
        sentenceTexts.push(part.text);
      }
      translatedParagraphs.push(sentenceTexts);
    }
    const body = joinTranslatedParagraphs(translatedParagraphs);
    const merged = mergeTranslateParts(parts);
    return { text: body, ...merged };
  }
  return doTranslateOne(text, from, to);
}

function breakdownFromCode(text, from) {
  const lines = text.split("\n").map((l) => l.trim()).filter((l) => l && !l.startsWith("#") && !l.startsWith(";"));
  const explained = [];
  for (const line of lines) {
    const [entry] = explainLines(line + "\n", from).filter(Boolean);
    if (entry) explained.push({ source: line, result: entry.display, why: entry.gloss });
  }
  return explained;
}

function breakdownFromEnglish(source, result) {
  const src = source.trim();
  if (!src) return [];
  return [{ source: src, result, why: "Matched a familiar instruction pattern." }];
}

function fromNatural(text, to) {
  const t = text.toLowerCase();
  let m = t.match(/(?:print|show|display|output)\s+['"]?(.+?)['"]?$/);
  if (m || t.includes("hello")) {
    const msg = m ? m[1].replace(/[\"']/g,"") : "Hello";
    const map = {
      python: `print("${msg}")`,
      javascript: `console.log("${msg}");`,
      quickbasic: `PRINT "${msg}"`,
      lolcode: `VISIBLE "${msg}"`,
      brainfood: `++++++++++[>+++++++>++++++++++>+++>+<<<<-]>++.>+.+++++++..+++.`,
      z80: `    ; print "${msg}"\n    LD   HL, msg\n    CALL print_string\nmsg: DEFM "${msg}"\n     DEFB 0`,
      shell: `echo "${msg}"`,
      sql: `SELECT '${msg}' AS message;`,
    };
    return map[to] || `# no mapping for ${to}`;
  }
  m = t.match(/(?:for|loop|count|repeat).*?(?:from\s+)?(\d+)\s+(?:to|through)\s+(\d+)/);
  if (m) {
    const [start, end] = [m[1], m[2]];
    const map = {
      python: `for i in range(${start}, ${+end+1}):\n    print(i)`,
      javascript: `for (let i = ${start}; i <= ${end}; i++) {\n  console.log(i);\n}`,
      quickbasic: `FOR i = ${start} TO ${end}\n  PRINT i\nNEXT i`,
      lolcode: `IM IN YR loop UPPIN YR i TIL BOTH SAEM i AN ${end}\n  VISIBLE i\nIM OUTTA YR loop`,
      shell: `for i in $(seq ${start} ${end}); do echo $i; done`,
    };
    return map[to] || `# no loop mapping for ${to}`;
  }
  m = t.match(/(?:set|let|make)\s+(\w+)\s+(?:to|=)\s+(.+)/);
  if (m) {
    const [v, val] = [m[1], m[2].trim()];
    const map = {
      python: `${v} = ${val}`,
      javascript: `let ${v} = ${val};`,
      quickbasic: `${v} = ${val}`,
      lolcode: `I HAS A ${v} ITZ ${val}`,
      shell: `${v}=${val}`,
    };
    return map[to] || `# no assignment mapping for ${to}`;
  }
  return `# No pattern matched\n# Source: ${text}`;
}

function withLiteral(sentence, literal) {
  return literal ? sentence + "\n" + literal : sentence;
}

function printed(inner) {
  const quoted = inner.length >= 2 && (inner[0] === '"' || inner[0] === "'") && inner[0] === inner.at(-1);
  const sentence = quoted ? "Print the word." : "Show the number.";
  return { display: withLiteral(sentence, inner), gloss: "Print " + inner };
}

function toEnglish(text, from) {
  return explainLines(text, from).map(e => e.display).join("\n") || "(no recognizable statements)";
}

function explainLines(text, from) {
  const lines = text.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#") && !l.startsWith(";"));
  const out = [];
  for (const s of lines) {
    if (from === "python" && s.startsWith("print(") && s.endsWith(")")) {
      const p = printed(s.slice(6, -1));
      out.push({ display: p.display, gloss: p.gloss });
    } else if (from === "python" && s.includes("for ") && s.includes(" in ")) {
      out.push({ display: "Start a loop.", gloss: "Start a loop" });
    } else if (from === "quickbasic" && s.toUpperCase().startsWith("PRINT")) {
      const p = printed(s.slice(5).trim());
      out.push({ display: p.display, gloss: p.gloss });
    } else if (from === "lolcode" && s.includes("VISIBLE")) {
      const rest = s.split("VISIBLE")[1].trim();
      out.push({ display: withLiteral("Print the word.", rest), gloss: "Show " + rest });
    } else if (from === "javascript" && s.includes("console.log")) {
      out.push({ display: withLiteral("Print the word on the screen.", s), gloss: "Print to console: " + s });
    } else if (from === "z80" && /LD/i.test(s)) {
      out.push({ display: withLiteral("Load the data.", s), gloss: "Load data: " + s });
    } else if (from === "z80" && /INC/i.test(s)) {
      out.push({ display: withLiteral("Add one.", s), gloss: "Increment: " + s });
    } else out.push({ display: "Execute: " + s, gloss: "Execute: " + s });
  }
  return out;
}

function codeToCode(text, from, to) {
  const gloss = explainLines(text, from).map(e => e.gloss).join("\n");
  if (!gloss || gloss.startsWith("(")) return `# Direct mapping not available\n# ${gloss}`;
  return fromNatural(gloss, to);
}

document.getElementById("source").addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    translate();
  }
});
document.getElementById("source").addEventListener("input", () => {
  const el = document.getElementById("source");
  el.classList.remove("source-highlighted");
});

const settingsEl = document.getElementById("settings");
const openBtn = document.getElementById("open-settings");
function toggleSettings(show) {
  settingsEl.hidden = show === undefined ? !settingsEl.hidden : !show;
  openBtn.textContent = settingsEl.hidden ? "Settings" : "Close Settings";
  if (!settingsEl.hidden) settingsEl.scrollIntoView({ behavior: "smooth" });
}
openBtn.onclick = () => toggleSettings();
SquirrelFeatures.renderNotice(document.getElementById("notice"), () => toggleSettings(true));
SquirrelFeatures.renderSettings(settingsEl);
SquirrelFeatures.onChange(() => fillSelects(true));
fillSelects(false);
</script>
</body>
</html>
